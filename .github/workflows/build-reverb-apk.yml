name: Build APK (with Reverb)

# 用途：在 GitHub Actions 上直接产出可安装的 APK（自带临时签名，安装时无需原版签名）
on:
  workflow_dispatch:
  push:
    branches: [reverb, main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        # GitHub 的 ubuntu runner 自带 Android SDK；之前用 android-actions/setup-android@v3
        # 会因为仓库里已没有旧的 "tools" 包而报 exit 1，这里直接调用自带的 sdkmanager。
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          export PATH="$CMDLINE:$SDK/platform-tools:$PATH"
          echo "sdkmanager dir: $CMDLINE"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch Maven mirrors for CI
        # 上游把阿里云镜像写死在 android/build.gradle 里，CI 上偶发 502 会让 Gradle
        # 直接禁用该仓库、导致依赖全部解析失败，这里在 CI 里去掉镜像走官方源。
        run: |
          sed -i '/maven.aliyun.com/d' android/build.gradle
          sed -n '1,22p' android/build.gradle

      - name: Restore fixed test signing key
        # 用仓库里固定的测试签名（android/test-signing.b64，base64 的 PKCS12），
        # 与官方签名不同、但每次构建完全一致 —— 同一个测试版可以直接覆盖安装。
        # 注意：这是公开的测试用密钥，不要用于正式分发。
        run: |
          base64 -d android/test-signing.b64 > android/app/release.keystore
          cat > android/keystore.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=musicfree
          RELEASE_KEY_ALIAS=musicfree-test
          RELEASE_KEY_PASSWORD=musicfree
          EOF
          chmod 600 android/keystore.properties android/app/release.keystore
          keytool -list -v -keystore android/app/release.keystore -storepass musicfree | grep -E "Alias name|SHA256:" || true

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -8

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: musicfree-reverb-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 公开仓库时，把 APK 附到 Release 上，方便直接下载（无需登录）
      - name: Publish APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag: reverb-build-${{ github.run_number }}
          name: MusicFree 混响构建 ${{ github.run_number }}
          body: 由 GitHub Actions 自动构建，使用固定测试签名（与官方不同，可覆盖安装同一测试版；口令 musicfree）。
          files: android/app/build/outputs/apk/release/*.apk
          prerelease: true
